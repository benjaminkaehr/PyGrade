<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PyGrade Web Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #0b0f19; color: #f8fafc; }
        
        /* Modern Glass Effect */
        .glass { background: rgba(30, 41, 59, 0.6); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.05); }
        .glass-panel { background: linear-gradient(145deg, rgba(30,41,59,0.8) 0%, rgba(15,23,42,0.8) 100%); border: 1px solid rgba(255, 255, 255, 0.05); }
        
        /* Scrollbar */
        .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #475569; }

        /* Animations */
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade-in { animation: fadeIn 0.4s ease-out forwards; }
        
        /* Grade Colors */
        .grade-excellent { color: #10b981; } /* Green */
        .grade-good { color: #3b82f6; }      /* Blue */
        .grade-warning { color: #f59e0b; }   /* Yellow */
        .grade-danger { color: #ef4444; }    /* Red */
    </style>
</head>
<body class="min-h-screen overflow-hidden selection:bg-blue-500/30">

    <div id="login-screen" class="flex h-screen w-full relative z-10 transition-opacity duration-500">
        <div class="w-full flex flex-col justify-center items-center p-8 relative overflow-hidden">
            <div class="absolute top-[-10%] left-[-10%] w-96 h-96 bg-blue-600/20 rounded-full blur-3xl"></div>
            <div class="absolute bottom-[-10%] right-[-10%] w-96 h-96 bg-purple-600/20 rounded-full blur-3xl"></div>
            
            <div class="glass-panel p-10 rounded-2xl w-full max-w-md space-y-8 relative z-10 shadow-2xl animate-fade-in">
                <div class="text-center">
                    <div class="inline-flex items-center justify-center w-16 h-16 rounded-xl bg-blue-500/20 text-blue-400 mb-4">
                        <i data-lucide="graduation-cap" size="32"></i>
                    </div>
                    <h2 class="text-3xl font-bold tracking-tight">PyGrade Pro</h2>
                    <p class="text-slate-400 mt-2 text-sm">Sign in to your academic workspace</p>
                </div>
                <div class="space-y-5">
                    <div>
                        <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Username</label>
                        <div class="relative">
                            <i data-lucide="user" class="absolute left-3 top-3 text-slate-500" size="20"></i>
                            <input type="text" id="username" class="w-full pl-10 p-3 rounded-xl bg-slate-900/50 border border-slate-700 focus:border-blue-500 focus:ring-1 focus:ring-blue-500 outline-none transition" placeholder="student_name">
                        </div>
                    </div>
                    <button onclick="login()" class="w-full bg-blue-600 hover:bg-blue-500 py-3 rounded-xl font-bold transition shadow-lg shadow-blue-500/25 flex items-center justify-center gap-2">
                        Enter Dashboard <i data-lucide="arrow-right" size="18"></i>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <div id="app-screen" class="hidden flex h-screen w-full animate-fade-in">
        
        <aside class="w-72 glass-panel flex flex-col border-r border-slate-800 relative z-20">
            <div class="p-6 border-b border-slate-800 flex items-center gap-3">
                <div class="w-10 h-10 rounded-lg bg-gradient-to-tr from-blue-600 to-purple-600 flex items-center justify-center shadow-lg">
                    <i data-lucide="graduation-cap" class="text-white" size="20"></i>
                </div>
                <div>
                    <h1 class="font-bold text-lg tracking-tight">PyGrade</h1>
                    <p class="text-xs text-slate-400" id="display-user">@student</p>
                </div>
            </div>
            
            <div class="p-6 flex-1 overflow-y-auto custom-scrollbar space-y-8">
                <div class="bg-slate-800/50 p-4 rounded-xl border border-slate-700/50">
                    <p class="text-xs text-slate-400 font-semibold uppercase tracking-wider mb-1">Global Average</p>
                    <p id="global-avg" class="text-3xl font-bold text-white">0.00</p>
                </div>

                <div>
                    <p class="text-xs text-slate-500 font-semibold uppercase tracking-wider mb-3">Menu</p>
                    <div class="space-y-2">
                        <button class="w-full flex items-center gap-3 bg-blue-500/10 text-blue-400 p-3 rounded-lg font-medium transition">
                            <i data-lucide="layout-dashboard" size="18"></i> Dashboard
                        </button>
                        <button onclick="openModal('subject-modal')" class="w-full flex items-center gap-3 text-slate-400 hover:bg-slate-800 hover:text-white p-3 rounded-lg font-medium transition">
                            <i data-lucide="plus-circle" size="18"></i> Add Subject
                        </button>
                    </div>
                </div>
            </div>
            
            <div class="p-6 border-t border-slate-800">
                <button onclick="logout()" class="w-full flex items-center justify-center gap-2 text-slate-400 hover:text-red-400 hover:bg-red-400/10 p-3 rounded-lg font-medium transition">
                    <i data-lucide="log-out" size="18"></i> Sign Out
                </button>
            </div>
        </aside>

        <main class="flex-1 flex flex-col h-full bg-[#0b0f19] relative">
            
            <header class="p-8 pb-4 flex justify-between items-end">
                <div>
                    <div class="flex items-center gap-4 mb-2">
                        <button onclick="prevSubject()" class="p-2 bg-slate-800 hover:bg-slate-700 rounded-lg transition"><i data-lucide="chevron-left" size="20"></i></button>
                        <h2 id="current-subject-title" class="text-3xl font-bold tracking-tight">No Subjects</h2>
                        <button onclick="nextSubject()" class="p-2 bg-slate-800 hover:bg-slate-700 rounded-lg transition"><i data-lucide="chevron-right" size="20"></i></button>
                    </div>
                    <p class="text-slate-400 text-sm">Manage your categories and grades below.</p>
                </div>
                <div class="text-right">
                    <p class="text-sm text-slate-400 font-medium">Subject Average</p>
                    <p id="subject-avg" class="text-4xl font-bold tracking-tight">N/A</p>
                </div>
            </header>

            <div class="p-8 pt-4 flex-1 flex flex-col overflow-hidden">
                
                <div class="flex flex-wrap items-center justify-between gap-4 mb-6 p-4 glass rounded-2xl">
                    <div id="category-tabs" class="flex gap-2 overflow-x-auto custom-scrollbar pb-1">
                        </div>
                    <div class="flex gap-3">
                        <button onclick="openModal('category-modal')" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-sm font-medium rounded-lg transition flex items-center gap-2">
                            <i data-lucide="folder-plus" size="16"></i> Category
                        </button>
                        <button onclick="openGradeModal()" class="px-4 py-2 bg-blue-600 hover:bg-blue-500 text-white text-sm font-medium rounded-lg transition shadow-lg shadow-blue-500/20 flex items-center gap-2">
                            <i data-lucide="plus" size="16"></i> Add Grade
                        </button>
                    </div>
                </div>

                <div class="flex-1 glass rounded-2xl overflow-hidden flex flex-col">
                    <div class="overflow-y-auto custom-scrollbar flex-1">
                        <table class="w-full text-left text-sm">
                            <thead class="bg-slate-900/80 sticky top-0 backdrop-blur-md z-10 border-b border-slate-700">
                                <tr>
                                    <th class="p-4 font-semibold text-slate-300">Grade</th>
                                    <th class="p-4 font-semibold text-slate-300">Points</th>
                                    <th class="p-4 font-semibold text-slate-300">Date</th>
                                    <th class="p-4 font-semibold text-slate-300 w-1/3">Notes</th>
                                    <th class="p-4 font-semibold text-slate-300 text-right">Actions</th>
                                </tr>
                            </thead>
                            <tbody id="grades-body" class="divide-y divide-slate-800/50">
                                </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <div id="modal-backdrop" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 hidden flex justify-center items-center opacity-0 transition-opacity duration-300">
        
        <div id="subject-modal" class="hidden bg-slate-900 border border-slate-700 p-6 rounded-2xl w-full max-w-sm shadow-2xl transform scale-95 transition-transform duration-300">
            <h3 class="text-xl font-bold mb-4">Add New Subject</h3>
            <input type="text" id="subject-input" class="w-full p-3 rounded-lg bg-slate-800 border border-slate-700 mb-6 focus:border-blue-500 outline-none" placeholder="e.g., Mathematics">
            <div class="flex gap-3">
                <button onclick="closeModals()" class="flex-1 py-2 bg-slate-800 hover:bg-slate-700 rounded-lg transition">Cancel</button>
                <button onclick="saveSubject()" class="flex-1 py-2 bg-blue-600 hover:bg-blue-500 rounded-lg transition">Save</button>
            </div>
        </div>

        <div id="category-modal" class="hidden bg-slate-900 border border-slate-700 p-6 rounded-2xl w-full max-w-sm shadow-2xl transform scale-95 transition-transform duration-300">
            <h3 class="text-xl font-bold mb-4">Add Category</h3>
            <input type="text" id="category-input" class="w-full p-3 rounded-lg bg-slate-800 border border-slate-700 mb-6 focus:border-blue-500 outline-none" placeholder="e.g., Midterms">
            <div class="flex gap-3">
                <button onclick="closeModals()" class="flex-1 py-2 bg-slate-800 hover:bg-slate-700 rounded-lg transition">Cancel</button>
                <button onclick="saveCategory()" class="flex-1 py-2 bg-blue-600 hover:bg-blue-500 rounded-lg transition">Save</button>
            </div>
        </div>

        <div id="grade-modal" class="hidden bg-slate-900 border border-slate-700 p-6 rounded-2xl w-full max-w-md shadow-2xl transform scale-95 transition-transform duration-300">
            <h3 id="grade-modal-title" class="text-xl font-bold mb-4">Add Grade</h3>
            <input type="hidden" id="grade-edit-index" value="-1">
            
            <div class="space-y-4 mb-6">
                <div>
                    <label class="block text-xs text-slate-400 mb-1">Grade (e.g. 1.0 - 6.0)</label>
                    <input type="number" step="0.1" id="grade-val" class="w-full p-3 rounded-lg bg-slate-800 border border-slate-700 focus:border-blue-500 outline-none">
                </div>
                <div class="flex gap-4">
                    <div class="flex-1">
                        <label class="block text-xs text-slate-400 mb-1">Points</label>
                        <input type="number" id="grade-pts" class="w-full p-3 rounded-lg bg-slate-800 border border-slate-700 focus:border-blue-500 outline-none" placeholder="Optional">
                    </div>
                    <div class="flex-1">
                        <label class="block text-xs text-slate-400 mb-1">Max Points</label>
                        <input type="number" id="grade-max" class="w-full p-3 rounded-lg bg-slate-800 border border-slate-700 focus:border-blue-500 outline-none" placeholder="Optional">
                    </div>
                </div>
                <div>
                    <label class="block text-xs text-slate-400 mb-1">Notes</label>
                    <input type="text" id="grade-notes" class="w-full p-3 rounded-lg bg-slate-800 border border-slate-700 focus:border-blue-500 outline-none" placeholder="e.g., Final Exam">
                </div>
            </div>
            
            <div class="flex gap-3">
                <button onclick="closeModals()" class="flex-1 py-2 bg-slate-800 hover:bg-slate-700 rounded-lg transition">Cancel</button>
                <button onclick="saveGrade()" class="flex-1 py-2 bg-blue-600 hover:bg-blue-500 rounded-lg transition">Save Grade</button>
            </div>
        </div>

    </div>

    <script>
        // --- STATE MANAGEMENT ---
        let state = {
            user: null,
            subjects: {}, 
            currentSubject: null,
            currentCategory: 'General'
        };

        // --- CORE FUNCTIONS ---
        function login() {
            const user = document.getElementById('username').value.trim();
            if(!user) return;
            
            state.user = user;
            const savedData = localStorage.getItem(`pygrade_pro_${user}`);
            state.subjects = savedData ? JSON.parse(savedData) : {};
            
            const subjectKeys = Object.keys(state.subjects);
            state.currentSubject = subjectKeys.length > 0 ? subjectKeys[0] : null;
            
            // Transition UI
            document.getElementById('login-screen').classList.add('opacity-0', 'pointer-events-none');
            setTimeout(() => {
                document.getElementById('login-screen').classList.add('hidden');
                document.getElementById('app-screen').classList.remove('hidden');
                document.getElementById('display-user').innerText = `@${user}`;
                refreshUI();
            }, 500);
        }

        function logout() {
            saveData();
            location.reload();
        }

        function saveData() {
            if(state.user) localStorage.setItem(`pygrade_pro_${state.user}`, JSON.stringify(state.subjects));
        }

        // --- MODAL CONTROLLERS ---
        function openModal(id) {
            const backdrop = document.getElementById('modal-backdrop');
            const target = document.getElementById(id);
            
            // Hide all modals first
            ['subject-modal', 'category-modal', 'grade-modal'].forEach(m => document.getElementById(m).classList.add('hidden'));
            
            backdrop.classList.remove('hidden');
            target.classList.remove('hidden');
            
            // Trigger animations
            setTimeout(() => {
                backdrop.classList.remove('opacity-0');
                target.classList.remove('scale-95');
                target.classList.add('scale-100');
            }, 10);
        }

        function closeModals() {
            const backdrop = document.getElementById('modal-backdrop');
            backdrop.classList.add('opacity-0');
            
            // Reset transforms
            ['subject-modal', 'category-modal', 'grade-modal'].forEach(m => {
                document.getElementById(m).classList.replace('scale-100', 'scale-95');
            });

            setTimeout(() => { backdrop.classList.add('hidden'); }, 300);
        }

        // --- DATA MUTATIONS ---
        function saveSubject() {
            const name = document.getElementById('subject-input').value.trim();
            if(name && !state.subjects[name]) {
                state.subjects[name] = { "General": [] };
                state.currentSubject = name;
                state.currentCategory = "General";
                document.getElementById('subject-input').value = "";
                closeModals();
                refreshUI();
            }
        }

        function saveCategory() {
            if(!state.currentSubject) return;
            const name = document.getElementById('category-input').value.trim();
            if(name && !state.subjects[state.currentSubject][name]) {
                state.subjects[state.currentSubject][name] = [];
                state.currentCategory = name;
                document.getElementById('category-input').value = "";
                closeModals();
                refreshUI();
            }
        }

        function openGradeModal(editIndex = -1) {
            if(!state.currentSubject) return alert("Please create a subject first.");
            
            document.getElementById('grade-edit-index').value = editIndex;
            
            if(editIndex >= 0) {
                document.getElementById('grade-modal-title').innerText = "Edit Grade";
                const grade = state.subjects[state.currentSubject][state.currentCategory][editIndex];
                document.getElementById('grade-val').value = grade.note;
                document.getElementById('grade-pts').value = grade.points || '';
                document.getElementById('grade-max').value = grade.max || '';
                document.getElementById('grade-notes').value = grade.notes || '';
            } else {
                document.getElementById('grade-modal-title').innerText = "Add Grade";
                document.getElementById('grade-val').value = '';
                document.getElementById('grade-pts').value = '';
                document.getElementById('grade-max').value = '';
                document.getElementById('grade-notes').value = '';
            }
            openModal('grade-modal');
        }

        function saveGrade() {
            const val = parseFloat(document.getElementById('grade-val').value);
            if(isNaN(val)) return;

            const editIndex = parseInt(document.getElementById('grade-edit-index').value);
            const newGrade = {
                note: val,
                points: document.getElementById('grade-pts').value,
                max: document.getElementById('grade-max').value,
                notes: document.getElementById('grade-notes').value,
                date: new Date().toLocaleDateString()
            };

            if(editIndex >= 0) {
                // Preserve original date if editing
                newGrade.date = state.subjects[state.currentSubject][state.currentCategory][editIndex].date;
                state.subjects[state.currentSubject][state.currentCategory][editIndex] = newGrade;
            } else {
                state.subjects[state.currentSubject][state.currentCategory].push(newGrade);
            }

            closeModals();
            refreshUI();
        }

        function deleteGrade(index) {
            if(confirm("Are you sure you want to delete this grade?")) {
                state.subjects[state.currentSubject][state.currentCategory].splice(index, 1);
                refreshUI();
            }
        }

        // --- NAVIGATION & UI UPDATES ---
        function nextSubject() {
            const keys = Object.keys(state.subjects);
            if(keys.length < 2) return;
            const idx = keys.indexOf(state.currentSubject);
            state.currentSubject = keys[(idx + 1) % keys.length];
            state.currentCategory = Object.keys(state.subjects[state.currentSubject])[0];
            refreshUI();
        }

        function prevSubject() {
            const keys = Object.keys(state.subjects);
            if(keys.length < 2) return;
            const idx = keys.indexOf(state.currentSubject);
            state.currentSubject = keys[(idx - 1 + keys.length) % keys.length];
            state.currentCategory = Object.keys(state.subjects[state.currentSubject])[0];
            refreshUI();
        }

        function getGradeColorClass(grade) {
            // Assuming higher is better (Swiss System: 6=Best, 4=Pass)
            if(grade >= 5.5) return 'grade-excellent';
            if(grade >= 4.5) return 'grade-good';
            if(grade >= 4.0) return 'grade-warning';
            return 'grade-danger';
        }

        function refreshUI() {
            saveData();
            
            const subjectTitle = document.getElementById('current-subject-title');
            const tabsContainer = document.getElementById('category-tabs');
            const body = document.getElementById('grades-body');
            const subjectAvgLabel = document.getElementById('subject-avg');
            const globalAvgLabel = document.getElementById('global-avg');

            if(!state.currentSubject) {
                subjectTitle.innerText = "No Subjects Added";
                tabsContainer.innerHTML = '';
                body.innerHTML = '<tr><td colspan="5" class="p-8 text-center text-slate-500">Add a subject from the sidebar to begin.</td></tr>';
                subjectAvgLabel.innerText = "N/A";
                subjectAvgLabel.className = "text-4xl font-bold tracking-tight text-slate-500";
                globalAvgLabel.innerText = "0.00";
                return;
            }

            subjectTitle.innerText = state.currentSubject;
            
            // Render Tabs
            tabsContainer.innerHTML = '';
            const categories = Object.keys(state.subjects[state.currentSubject]);
            categories.forEach(cat => {
                const isActive = state.currentCategory === cat;
                const btn = document.createElement('button');
                btn.className = `px-4 py-2 rounded-lg text-sm font-medium transition whitespace-nowrap ${isActive ? 'bg-blue-600/20 text-blue-400 border border-blue-500/30' : 'text-slate-400 hover:text-slate-200 hover:bg-slate-800'}`;
                btn.innerText = cat;
                btn.onclick = () => { state.currentCategory = cat; refreshUI(); };
                tabsContainer.appendChild(btn);
            });

            // Render Grades Table
            body.innerHTML = '';
            const grades = state.subjects[state.currentSubject][state.currentCategory] || [];
            
            if(grades.length === 0) {
                body.innerHTML = '<tr><td colspan="5" class="p-8 text-center text-slate-500 border-none">No grades in this category.</td></tr>';
            } else {
                grades.forEach((g, i) => {
                    const colorClass = getGradeColorClass(g.note);
                    const pts = g.points ? `${g.points}${g.max ? ` / ${g.max}` : ''}` : '-';
                    
                    const row = `
                        <tr class="hover:bg-slate-800/30 transition group">
                            <td class="p-4 font-bold text-lg ${colorClass}">${g.note.toFixed(2)}</td>
                            <td class="p-4 text-slate-400">${pts}</td>
                            <td class="p-4 text-slate-400">${g.date}</td>
                            <td class="p-4 text-slate-300">${g.notes || '-'}</td>
                            <td class="p-4 text-right opacity-0 group-hover:opacity-100 transition-opacity">
                                <button onclick="openGradeModal(${i})" class="text-slate-400 hover:text-blue-400 p-2 rounded-md hover:bg-blue-400/10 transition"><i data-lucide="edit-2" size="16"></i></button>
                                <button onclick="deleteGrade(${i})" class="text-slate-400 hover:text-red-400 p-2 rounded-md hover:bg-red-400/10 transition ml-1"><i data-lucide="trash-2" size="16"></i></button>
                            </td>
                        </tr>
                    `;
                    body.innerHTML += row;
                });
            }

            // Calculate Subject Average (combining all categories in the subject)
            let subjTotal = 0, subjCount = 0;
            categories.forEach(cat => {
                state.subjects[state.currentSubject][cat].forEach(g => {
                    subjTotal += g.note;
                    subjCount++;
                });
            });

            if(subjCount > 0) {
                const avg = subjTotal / subjCount;
                subjectAvgLabel.innerText = avg.toFixed(2);
                subjectAvgLabel.className = `text-4xl font-bold tracking-tight ${getGradeColorClass(avg)}`;
            } else {
                subjectAvgLabel.innerText = "N/A";
                subjectAvgLabel.className = "text-4xl font-bold tracking-tight text-slate-500";
            }

            // Calculate Global Average
            let globalTotal = 0, globalCount = 0;
            Object.values(state.subjects).forEach(subject => {
                Object.values(subject).forEach(catGrades => {
                    catGrades.forEach(g => {
                        globalTotal += g.note;
                        globalCount++;
                    });
                });
            });

            if(globalCount > 0) {
                const globalAvg = globalTotal / globalCount;
                globalAvgLabel.innerText = globalAvg.toFixed(2);
                globalAvgLabel.className = `text-3xl font-bold ${getGradeColorClass(globalAvg)}`;
            } else {
                globalAvgLabel.innerText = "0.00";
                globalAvgLabel.className = "text-3xl font-bold text-slate-500";
            }

            lucide.createIcons();
        }

        // Initialize icons on load
        lucide.createIcons();
    </script>
</body>
</html>
